<article class="dossier" aria-labelledby="character-name">
  <span class="dossier__ghost" aria-hidden="true">{{ initial() }}</span>

  <header class="dossier__head">
    <p class="dossier__eyebrow">
      <span>Registro de personagem</span>
      <span class="dossier__brand" aria-hidden="true">Hexatombe</span>
    </p>
    <h1 id="character-name" class="dossier__name">{{ name() }}</h1>
  </header>

  <blockquote class="oath">
    <p class="oath__text">
      <span class="oath__mark" aria-hidden="true">“</span>{{ dossier().quote
      }}<span class="oath__mark oath__mark--close" aria-hidden="true">”</span>
    </p>
  </blockquote>

  <app-character-attributes
    class="dossier__attributes"
    [attributes]="dossier().attributes"
    [emblem]="dossier().emblem"
  />

  <div class="dossier__side">
    @if (portrait(); as portrait) {
      <figure class="dossier__portrait">
        <img [src]="portrait.src" [alt]="portrait.alt" />
      </figure>
    }

    <app-character-abilities [abilities]="dossier().abilities" />
  </div>
</article>
