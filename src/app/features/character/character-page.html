<main
  class="destiny-page"
  [class.destiny-page--dossier]="dossier() !== null"
  [attr.data-mood]="character().theme.mood"
>
  <app-atmosphere variant="character" [tone]="character().theme.accent" />

  <a class="return" routerLink="/galeria" aria-label="Retornar à galeria">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M15 4 7 12l8 8" />
    </svg>
  </a>

  @if (dossier(); as dossier) {
    <app-character-dossier
      [name]="character().name"
      [mood]="character().theme.mood"
      [dossier]="dossier"
    />

    @if (sheet()) {
      <section class="sheet-call" aria-labelledby="sheet-call-label">
        <p id="sheet-call-label" class="sheet-call__note">Documento selado</p>

        <a class="sheet-call__button" [routerLink]="sheetLink()">
          <span class="sheet-call__seal" aria-hidden="true"></span>
          Ver ficha completa
        </a>

        <p class="sheet-call__hint">Requer a senha deste destino.</p>
      </section>
    }
  } @else {
    <section class="identity" aria-labelledby="character-name">
      <span class="identity__thread" aria-hidden="true"></span>
      <h1 id="character-name" class="identity__name" [attr.data-initial]="initial()">
        {{ character().name }}
      </h1>
      <span class="identity__seal" aria-hidden="true"></span>
    </section>
  }
</main>
